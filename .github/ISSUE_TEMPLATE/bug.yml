name: 버그 / 문제 해결 (Bug)
description: 회로 오동작, 펌웨어 버그, 통신 에러 등 발생한 문제를 등록합니다.
title: "[Bug] "
labels: ["bug"]
body:
  - type: dropdown
    id: part
    attributes:
      label: 관련 분야
      options:
        - HW (하드웨어/회로)
        - FW (펌웨어/소프트웨어)
        - GNC (제어/알고리즘)
        - GS (지상국/통신)
        - 기타
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 어떤 문제가 발생했나요?
      description: 문제 현상을 구체적으로 설명해주세요.
      placeholder: "예: 고도 300m 이상 모의 시 기압 센서 SPI 읽기 타임아웃 발생"
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 재현 방법 / 에러 로그 / 사진
      description: 어떻게 문제를 재현할 수 있는지, 혹은 시리얼 로그나 회로 사진을 첨부해주세요.
    validations:
      required: false
  - type: textarea
    id: solution
    attributes:
      label: 예상 원인 또는 해결 방안
      description: 짐작되는 원인이나 시도해 볼 해결책이 있다면 적어주세요.
    validations:
      required: false
