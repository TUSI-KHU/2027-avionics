name: 회의록 (Meeting)
description: 정기 회의 및 기술 회의 안건과 결정 사항을 기록합니다.
title: "[Meeting] YYYY-MM-DD 정기 회의"
labels: ["meeting"]
body:
  - type: input
    id: attendees
    attributes:
      label: 참석자
      placeholder: "예: @홍길동, @이순신, @강감찬"
    validations:
      required: true
  - type: textarea
    id: agenda
    attributes:
      label: 논의 안건
      value: |
        1. 지난주 진행 상황 점검
        2. 주요 이슈 및 기술적 난제 논의
        3. 이번 주 작업 계획
    validations:
      required: true
  - type: textarea
    id: decisions
    attributes:
      label: 회의 결정 사항 및 후속 작업 (Action Items)
      value: |
        - [결정] 
        - [Task] @담당자: 작업 내용 (기한: MM/DD)
    validations:
      required: true
