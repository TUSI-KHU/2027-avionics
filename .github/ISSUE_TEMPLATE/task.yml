name: 작업 / 기능 개발 (Task)
description: 새 기능 개발, 회로 설계, 펌웨어 작성 또는 문서 작업을 등록합니다.
title: "[Task] "
labels: ["task"]
body:
  - type: dropdown
    id: part
    attributes:
      label: 담당 분야
      options:
        - HW (하드웨어/회로)
        - FW (펌웨어/소프트웨어)
        - GNC (제어/알고리즘)
        - GS (지상국/통신)
        - DOC (문서/시스템)
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: 작업 내용
      description: 무엇을 왜 개발하거나 변경하는지 간단히 적어주세요.
      placeholder: "예: STM32F405 기반 SPI 플래시 메모리 드라이버 작성 및 동작 검증"
    validations:
      required: true
  - type: textarea
    id: todo
    attributes:
      label: 해야 할 일 (TODO)
      description: 완료해야 할 세부 작업 목록입니다.
      value: |
        - [ ] 
        - [ ] 
        - [ ] 동작 확인 및 테스트
    validations:
      required: false
