; PlatformIO Project Configuration File for NURA Flight Computer
; Target: Espressif ESP32-S3-WROOM-1-N16R8
; Framework: ESP-IDF with FreeRTOS
; ADR: docs/wiki/decisions/ADR-001-mcu-selection.md

[platformio]
default_envs = esp32s3_flight_computer
src_dir = src
include_dir = include
test_dir = test

[env:esp32s3_flight_computer]
platform = espressif32
board = esp32-s3-devkitc-1
framework = espidf

; ESP32-S3-WROOM-1-N16R8 사양 (240MHz, 16MB Flash, 8MB Octal PSRAM)
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.flash_mode = qio
board_build.flash_size = 16MB
board_build.psram_type = opi

monitor_speed = 115200
monitor_filters = esp32_exception_decoder

build_flags =
    -D CORE_DEBUG_LEVEL=3
    -D BOARD_HAS_PSRAM
    -I include
    -I src/common
    -I src/bsp
    -I src/flight
    -I src/gnc

[env:native_test]
platform = native
test_framework = unity
